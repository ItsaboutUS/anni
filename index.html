<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Anniversary, My Chakli, My Kiddo!</title>
  <style>
    /* Global Styles */
    :root {
      --primary-color: #fe63946;
      --bg-color: #fff0f5;
      --text-color: #2b2d42;
      --card-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 20px 10px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Quiz Box Styling */
    #quiz-box {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
      transition: all 0.5s ease-in-out;
    }

    .quiz-input-group {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .quiz-input-group input {
      padding: 10px 15px;
      border: 2px solid #ffb6c1;
      border-radius: 6px;
      outline: none;
      font-size: 1rem;
    }

    .quiz-input-group button {
      padding: 10px 20px;
      background-color: #ff69b4;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .quiz-input-group button:hover {
      background-color: #ff1493;
    }

    /* Gallery Grid & Sections */
    .reveal-section {
      margin-bottom: 40px;
    }

    .section-title {
      font-size: 1.5rem;
      margin-bottom: 15px;
      color: #ff1493;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }

    .photo-card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    /* Blurred state for locked images */
    .photo-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      filter: blur(12px) opacity(0.3);
      transition: filter 0.8s ease, opacity 0.8s ease;
      pointer-events: none;
    }

    /* Unlocked state clears blur */
    .reveal-section.unlocked .photo-card img {
      filter: blur(0) opacity(1);
      pointer-events: auto;
    }

    .photo-caption {
      padding: 10px;
      font-size: 0.9rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Background Music -->
  <audio id="bg-music" loop autoplay src="song.mp3"></audio>

  <div class="container">
    <header>
      <h1>Happy Anniversary, My Chakli, My Kiddo!</h1>
    </header>

    <!-- Moving Quiz Box -->
    <div id="quiz-box">
      <h3 id="riddle-title">Chapter 1 Riddle</h3>
      <p id="riddle-question">Enter the secret answer to unlock the first set of memories! ❤️</p>
      <div class="quiz-input-group">
        <input type="text" id="riddle-input" placeholder="Type your answer...">
        <button onclick="handleRiddleSubmit()">Unlock</button>
      </div>
    </div>

    <!-- Gallery Wrapper -->
    <div id="gallery-wrapper">
      <div class="reveal-section" id="section-1">
        <h3 class="section-title">Chapter 1: The Beginning ❤️</h3>
        <div class="gallery-grid" id="grid-1"></div>
      </div>

      <div class="reveal-section" id="section-2">
        <h3 class="section-title">Chapter 2: Growing Together 💕</h3>
        <div class="gallery-grid" id="grid-2"></div>
      </div>

      <div class="reveal-section" id="section-3">
        <h3 class="section-title">Chapter 3: Unforgettable Moments ✨</h3>
        <div class="gallery-grid" id="grid-3"></div>
      </div>

      <div class="reveal-section" id="section-4">
        <h3 class="section-title">Chapter 4: Special Memories 🌟</h3>
        <div class="gallery-grid" id="grid-4"></div>
      </div>

      <div class="reveal-section" id="section-5">
        <h3 class="section-title">Chapter 5: Forever & Always 💖</h3>
        <div class="gallery-grid" id="grid-5"></div>
      </div>
    </div>
  </div>

  <script>
    // 1. Riddles Configuration
    const riddles = [
      { question: "Where was our very first date?", answer: "coffee" },
      { question: "What is my favorite nickname for you?", answer: "chakli" },
      { question: "Which month did we first start talking?", answer: "august" },
      { question: "What is our favorite shared food?", answer: "pizza" },
      { question: "What is the magic word?", answer: "love" }
    ];

    let currentRiddleIndex = 1;

    // 2. Divide 63 Photos into 5 Sections (13, 13, 13, 12, 12)
    const totalPhotos = 63;
    const photosPerSection = [13, 13, 13, 12, 12];
    let currentPhotoIndex = 1;

    for (let sec = 1; sec <= 5; sec++) {
      const gridContainer = document.getElementById(`grid-${sec}`);
      const count = photosPerSection[sec - 1];

      for (let i = 0; i < count; i++) {
        const photoNum = currentPhotoIndex;
        const photoCard = document.createElement('div');
        photoCard.className = 'photo-card';

        const img = document.createElement('img');
        img.alt = `Memory ${photoNum}`;
        img.loading = 'lazy';

        // Matches images/dj (1).jpg through images/dj (63).jpg
        img.src = `images/dj (${photoNum}).jpg`;

        const caption = document.createElement('div');
        caption.className = 'photo-caption';
        caption.innerText = `Memory #${photoNum} ❤️`;

        photoCard.appendChild(img);
        photoCard.appendChild(caption);
        gridContainer.appendChild(photoCard);

        currentPhotoIndex++;
      }
    }

    // Initialize Riddle UI
    function updateRiddleUI(index) {
      document.getElementById('riddle-title').innerText = `Chapter ${index} Riddle`;
      document.getElementById('riddle-question').innerText = riddles[index - 1].question;
    }
    updateRiddleUI(1);

    // 3. Quiz Submission and Section Unlocking
    function handleRiddleSubmit() {
      const answerInput = document.getElementById('riddle-input');
      const userAnswer = answerInput.value.trim().toLowerCase();
      const expectedAnswer = riddles[currentRiddleIndex - 1].answer.toLowerCase();

      if (userAnswer === expectedAnswer) {
        // Unlock current section
        const currentSection = document.getElementById(`section-${currentRiddleIndex}`);
        currentSection.classList.add('unlocked');

        currentRiddleIndex++;

        if (currentRiddleIndex <= 5) {
          const nextSection = document.getElementById(`section-${currentRiddleIndex}`);
          
          // Move quiz box right above the next section
          nextSection.parentNode.insertBefore(document.getElementById('quiz-box'), nextSection);
          
          updateRiddleUI(currentRiddleIndex);
          answerInput.value = '';
        } else {
          // Hide quiz box when all sections are unlocked
          document.getElementById('quiz-box').style.display = 'none';
        }
      } else {
        alert('Incorrect answer! Try again ❤️');
      }
    }

    // Autoplay audio on first interaction to bypass browser restrictions
    document.addEventListener('click', () => {
      const music = document.getElementById('bg-music');
      if (music && music.paused) {
        music.play().catch(() => {});
      }
    }, { once: true });
  </script>
</body>
</html>
